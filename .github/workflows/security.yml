name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  security-scan-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Security Tools
        run: pip install bandit safety

      - name: Run Bandit (SAST Code Scan)
        run: bandit -r backend/ -ll -ii

      - name: Run Safety (Dependency Scan)
        run: safety check -r backend/requirements.txt --full-report

      - name: Run Trivy (Docker Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build --push -t ghcr.io/ahmedalkhouli/last_project-backend:latest -f backend/Dockerfile .

          docker push ghcr.io/ahmedalkhouli/last_project-backend:latest
      - name: Deploy Secure Architecture
        run: |
          docker compose down
          
          docker compose -f vault/docker-compose.yaml up -d
          docker compose up -d db
          sleep 3
          
          docker pull ghcr.io/ahmedalkhouli/last_project-backend:latest
          
          ./vault/start_secure.sh
