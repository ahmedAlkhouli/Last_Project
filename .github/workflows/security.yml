name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  security-scan-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Security Tools
        run: pip install bandit safety

      - name: Run Bandit (SAST Code Scan)
        run: bandit -r backend/ -ll -ii

      - name: Run Safety (Dependency Scan)
        run: safety check -r backend/requirements.txt --full-report

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image (Local only for scanning)
        run: |
          docker build -t ghcr.io/ahmedalkhouli/last_project-backend:latest -f backend/Dockerfile .

      - name: Run Trivy (Docker Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/ahmedalkhouli/last_project-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image to GHCR
        run: |
          docker push ghcr.io/ahmedalkhouli/last_project-backend:latest

      - name: Deploy Secure Architecture
        run: |
          # 1. Switch out of the temporary runner clone and into the REAL project directory
          cd /home/aau/Desktop/Skills_Utilization
          
          # 2. Tear down the old master stack
          docker compose down
          
          # 3. Ensure Vault stack and DB are running
          docker compose -f vault/docker-compose.yaml up -d
          docker compose up -d db
          
          # 4. Give Vault 10 seconds to boot up with proper permissions
          sleep 10
          
          # 5. Unseal Vault automatically
          UNSEAL_KEY=$(grep 'Unseal Key 1:' vault/vault_keys.txt | awk '{print $NF}')
          docker exec vault-server env VAULT_ADDR="http://127.0.0.1:8200" vault operator unseal $UNSEAL_KEY
          
          # 6. Pull the fresh GHCR image to the local machine
          docker pull ghcr.io/ahmedalkhouli/last_project-backend:latest
          
          # 7. Fetch secrets and launch backend/frontend
          ./vault/start_secure.sh
