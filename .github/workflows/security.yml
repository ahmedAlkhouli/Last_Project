name: Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  security-scan-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Security Tools
        run: pip install bandit safety

      - name: Run Bandit (SAST Code Scan)
        run: bandit -r backend/ -ll -ii

      - name: Run Safety (Dependency Scan)
        run: safety check -r backend/requirements.txt --full-report

      - name: Run Trivy (Docker Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          docker build --push -t ghcr.io/ahmedalkhouli/last_project-backend:latest -f backend/Dockerfile .

      - name: Deploy Secure Architecture
        run: |
         # 1. Switch out of the temporary runner clone and into the REAL project directory
          cd /home/aau/Desktop/Skills_Utilization
          
          # 2. Tear down the old master stack
          docker compose down
          
          # 3. Ensure Vault stack and DB are running
          docker compose -f vault/docker-compose.yaml up -d
          docker compose up -d db
          
          # 4. Get Vault's direct internal container IP and wait for it to wake up
          echo "Waiting for Vault container to initialize..."
          for i in {1..30}; do
            VAULT_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' vault-server 2>/dev/null || true)
            if [ ! -z "$VAULT_IP" ] && curl -s http://$VAULT_IP:8200/v1/sys/health >/dev/null 2>&1; then
              echo "Vault is up at IP $VAULT_IP!"
              break
            fi
            sleep 1
          done
          
          # 5. Unseal Vault automatically using the container IP
          UNSEAL_KEY=$(grep 'Unseal Key 1:' vault/vault_keys.txt | awk '{print $NF}')
          docker exec vault-server env VAULT_ADDR="http://127.0.0.1:8200" vault operator unseal $UNSEAL_KEY
          
          # 6. Pull the fresh GHCR image to the local machine
          docker pull ghcr.io/ahmedalkhouli/last_project-backend:latest
          
          # 7. Fetch secrets and launch backend/frontend
          ./vault/start_secure.sh
